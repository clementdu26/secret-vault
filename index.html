<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Secret Vault">
<title>SECRET VAULT – iOS Edition</title>
<style>
  :root {
    --bg: #07080f;
    --card: #111424;
    --border: #232847;
    --gold: #ffd700;
    --cyan: #00f3ff;
    --purple: #9d4edd;
    --danger: #ff2a5f;
    --success: #00e676;
    --text: #e2e8f0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: radial-gradient(circle at top, #131836 0%, var(--bg) 70%);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
    -webkit-user-select: none;
    user-select: none;
  }

  #particles-canvas {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 999;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(7, 8, 15, 0.88);
    -webkit-backdrop-filter: blur(15px);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid var(--border);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .title-area h1 {
    font-size: 1.25rem;
    background: linear-gradient(90deg, var(--gold), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1.5px;
    font-weight: 800;
  }

  .actions-row {
    display: flex;
    gap: 8px;
  }

  .stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .stat-pill {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 14px;
    font-size: 0.85rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .progress-wrap {
    width: 90px;
    height: 8px;
    background: #1c2038;
    border-radius: 10px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--purple), var(--cyan));
    transition: width 0.5s ease;
  }

  button.icon-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 11px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    touch-action: manipulation;
  }

  button.icon-btn:active {
    transform: scale(0.95);
    border-color: var(--cyan);
  }

  .container {
    max-width: 600px;
    margin: 18px auto;
    padding: 0 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .chest-card {
    background: linear-gradient(145deg, #13172b, #0d101f);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    display: grid;
    grid-template-columns: 82px 1fr;
    align-items: center;
    gap: 14px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
  }

  .chest-card.unlocked {
    border-color: rgba(0, 230, 118, 0.45);
    background: linear-gradient(145deg, #0f1f1d, #0b121c);
  }

  .chest-card.secret-reveal {
    animation: revealDrop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    border-color: var(--purple);
    box-shadow: 0 0 25px rgba(157, 78, 221, 0.3);
  }

  .chest-card.final-chest {
    border: 2px solid var(--gold);
    background: radial-gradient(circle at center, #261f0d, #0d0f1a);
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.25);
  }

  .chest-visual {
    width: 82px;
    height: 82px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .chest-svg {
    width: 78px;
    height: 78px;
    overflow: visible;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
  }

  .chest-info h2 {
    font-size: 1.05rem;
    margin-bottom: 5px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .badge {
    font-size: 0.65rem;
    padding: 2px 7px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 700;
  }

  .badge-normal { background: #1e2542; color: #94a3b8; }
  .badge-secret { background: rgba(157, 78, 221, 0.25); color: #d8b4fe; border: 1px solid var(--purple); }
  .badge-final { background: rgba(255, 215, 0, 0.25); color: var(--gold); border: 1px solid var(--gold); }

  .chest-desc {
    font-size: 0.84rem;
    line-height: 1.35;
    color: #94a3b8;
  }

  .reward-box {
    display: none;
    margin-top: 8px;
    padding: 7px 10px;
    background: rgba(0, 230, 118, 0.12);
    border: 1px solid rgba(0, 230, 118, 0.35);
    border-radius: 10px;
    color: var(--success);
    font-weight: 700;
    font-size: 0.85rem;
    animation: popIn 0.5s ease forwards;
  }

  .chest-card.unlocked .reward-box { display: inline-block; }

  .code-controls {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }

  .code-input {
    flex: 1;
    height: 46px;
    padding: 0 12px;
    background: #080a12;
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--cyan);
    font-size: 18px;
    font-weight: 800;
    text-align: center;
    letter-spacing: 6px;
    outline: none;
    -webkit-appearance: none;
    -webkit-user-select: text;
    user-select: text;
  }

  .code-input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(0, 243, 255, 0.25);
  }

  .validate-btn {
    height: 46px;
    padding: 0 22px;
    background: linear-gradient(135deg, #2563eb, #06b6d4);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }

  .validate-btn:active {
    transform: scale(0.96);
    filter: brightness(1.2);
  }

  .chest-card.unlocked .code-controls { display: none; }

  .shake-error { animation: shake 0.45s ease; border-color: var(--danger) !important; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  @keyframes revealDrop {
    0% { opacity: 0; transform: scale(0.85) translateY(-25px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    80% { transform: scale(1.06); }
    100% { transform: scale(1); opacity: 1; }
  }

  .anim-1 .chest-svg { animation: a1_explode 1.1s forwards; }
  @keyframes a1_explode {
    0% { transform: scale(1); }
    30% { transform: scale(1.35); filter: brightness(2) drop-shadow(0 0 20px gold); }
    50% { transform: scale(0.2); opacity: 0; }
    100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 10px gold); }
  }

  .anim-2 .chest-svg { animation: a2_spin 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards; }
  @keyframes a2_spin {
    0% { transform: rotateY(0) scale(1); }
    50% { transform: rotateY(1080deg) scale(1.3); }
    100% { transform: rotateY(1440deg) scale(1); }
  }

  .anim-3 .chest-svg { animation: a3_levitate 1.3s ease-in-out forwards; }
  @keyframes a3_levitate {
    0% { transform: translateY(0); }
    40% { transform: translateY(-40px) rotate(-8deg); filter: drop-shadow(0 30px 15px rgba(0,243,255,0.6)); }
    70% { transform: translateY(-35px) rotate(8deg); }
    100% { transform: translateY(0) rotate(0); }
  }

  .anim-4 .chest-svg { animation: a4_quake 1.1s linear forwards; }
  @keyframes a4_quake {
    0%, 10%, 20%, 30%, 40%, 50% { transform: translate(3px, -3px) skewX(5deg); filter: contrast(2); }
    5%, 15%, 25%, 35%, 45% { transform: translate(-3px, 3px) skewX(-5deg); }
    60% { transform: scaleY(0.6) scaleX(1.3); }
    100% { transform: scale(1); }
  }

  .anim-5 .chest-svg { animation: a5_portal 1.3s ease-in-out forwards; }
  @keyframes a5_portal {
    0% { transform: rotate(0) scale(1); }
    45% { transform: rotate(360deg) scale(0); filter: hue-rotate(180deg) blur(4px); }
    55% { transform: rotate(-360deg) scale(0); }
    100% { transform: rotate(0) scale(1); filter: none; }
  }

  .anim-6 .chest-svg { animation: a6_glitch 1.1s steps(4) forwards; }
  @keyframes a6_glitch {
    0% { opacity: 1; clip-path: inset(0 0 0 0); }
    25% { opacity: 0.3; clip-path: inset(20% 0 40% 0); transform: translateX(12px); }
    50% { opacity: 0.8; clip-path: inset(60% 0 10% 0); transform: translateX(-12px); }
    75% { opacity: 0.1; transform: scale(1.2); }
    100% { opacity: 1; clip-path: inset(0 0 0 0); transform: translateX(0); }
  }

  .anim-7 .chest-svg { animation: a7_lightning 1s ease forwards; }
  @keyframes a7_lightning {
    0%, 20%, 40% { filter: brightness(5) invert(1); transform: translateY(-5px); }
    10%, 30% { filter: brightness(0.2); transform: translateY(5px); }
    100% { filter: drop-shadow(0 0 15px #00f3ff); transform: translateY(0); }
  }

  .anim-8 .chest-svg { animation: a8_crystal 1.3s ease forwards; }
  @keyframes a8_crystal {
    0% { filter: saturate(1); }
    50% { transform: scale(1.2) rotate(45deg); filter: hue-rotate(190deg) brightness(1.8) drop-shadow(0 0 20px #00f3ff); }
    100% { transform: scale(1) rotate(0); filter: hue-rotate(0deg); }
  }

  .anim-9 .chest-svg { animation: a9_shockwave 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes a9_shockwave {
    0% { transform: scale(1); }
    30% { transform: scale(0.5); }
    60% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
