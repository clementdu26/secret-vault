<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SECRET VAULT</title>
<style>
  :root {
    --bg: #07080f;
    --card: #111424;
    --border: #232847;
    --gold: #ffd700;
    --cyan: #00f3ff;
    --purple: #9d4edd;
    --danger: #ff2a5f;
    --success: #00e676;
    --text: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(circle at top, #131836 0%, var(--bg) 70%); color: var(--text); min-height: 100vh; padding-bottom: 90px; }
  #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
  header { position: sticky; top: 0; z-index: 100; background: rgba(7, 8, 15, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; flex-direction: column; gap: 10px; }
  .header-top { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 1.25rem; background: linear-gradient(90deg, var(--gold), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; letter-spacing: 1.5px; }
  .stats-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .stat-pill { background: var(--card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 14px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .progress-wrap { width: 85px; height: 8px; background: #1c2038; border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--purple), var(--cyan)); transition: width 0.4s; }
  button.icon-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 7px 11px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; }
  .container { max-width: 600px; margin: 18px auto; padding: 0 14px; display: flex; flex-direction: column; gap: 16px; }
  .chest-card { background: linear-gradient(145deg, #13172b, #0d101f); border: 1px solid var(--border); border-radius: 18px; padding: 16px; display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: 14px; position: relative; overflow: hidden; }
  .chest-card.unlocked { border-color: rgba(0, 230, 118, 0.5); background: linear-gradient(145deg, #0f1f1d, #0b121c); }
  .chest-card.final-chest { border: 2px solid var(--gold); background: radial-gradient(circle at center, #261f0d, #0d0f1a); }
  .chest-svg { width: 76px; height: 76px; overflow: visible; }
  .chest-info h2 { font-size: 1.05rem; margin-bottom: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .badge { font-size: 0.65rem; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; font-weight: 700; }
  .badge-normal { background: #1e2542; color: #94a3b8; }
  .badge-secret { background: rgba(157, 78, 221, 0.25); color: #d8b4fe; border: 1px solid var(--purple); }
  .badge-final { background: rgba(255, 215, 0, 0.25); color: var(--gold); border: 1px solid var(--gold); }
  .chest-desc { font-size: 0.84rem; color: #94a3b8; }
  .reward-box { display: none; margin-top: 8px; padding: 7px 10px; background: rgba(0, 230, 118, 0.12); border: 1px solid rgba(0, 230, 118, 0.35); border-radius: 10px; color: var(--success); font-weight: 700; font-size: 0.85rem; }
  .chest-card.unlocked .reward-box { display: inline-block; }
  .code-controls { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 4px; }
  .code-input { flex: 1; height: 46px; background: #080a12; border: 2px solid var(--border); border-radius: 12px; color: var(--cyan); font-size: 18px; font-weight: 800; text-align: center; letter-spacing: 6px; outline: none; }
  .code-input:focus { border-color: var(--cyan); }
  .validate-btn { height: 46px; padding: 0 22px; background: linear-gradient(135deg, #2563eb, #06b6d4); border: none; border-radius: 12px; color: white; font-size: 15px; font-weight: 700; }
  .chest-card.unlocked .code-controls { display: none; }
  .shake-error { animation: shake 0.4s ease; border-color: var(--danger) !important; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25%, 75% { transform: translateX(-8px); } 50% { transform: translateX(8px); } }

  /* 15 ANIMATIONS DISTINCTES */
  .anim-1 .chest-svg { animation: a1 1.1s forwards; } @keyframes a1 { 0% { transform: scale(1); } 40% { transform: scale(1.4); filter: brightness(2.5); } 60% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .anim-2 .chest-svg { animation: a2 1.2s forwards; } @keyframes a2 { 0% { transform: rotateY(0); } 50% { transform: rotateY(1080deg) scale(1.3); } 100% { transform: rotateY(1440deg) scale(1); } }
  .anim-3 .chest-svg { animation: a3 1.2s forwards; } @keyframes a3 { 0% { transform: translateY(0); } 50% { transform: translateY(-40px) rotate(-10deg); } 100% { transform: translateY(0); } }
  .anim-4 .chest-svg { animation: a4 1s forwards; } @keyframes a4 { 0%, 20%, 40% { transform: translate(-4px, 4px) skewX(6deg); } 10%, 30%, 50% { transform: translate(4px, -4px) skewX(-6deg); } 100% { transform: none; } }
  .anim-5 .chest-svg { animation: a5 1.2s forwards; } @keyframes a5 { 0% { transform: scale(1) rotate(0); } 50% { transform: scale(0) rotate(360deg); } 100% { transform: scale(1) rotate(0); } }
  .anim-6 .chest-svg { animation: a6 1s steps(3) forwards; } @keyframes a6 { 25% { opacity: 0.2; transform: translateX(15px); } 50% { opacity: 0.8; transform: translateX(-15px); } 100% { opacity: 1; transform: none; } }
  .anim-7 .chest-svg { animation: a7 1s forwards; } @keyframes a7 { 0%, 30% { filter: brightness(5) invert(1); } 15%, 45% { filter: brightness(0.2); } 100% { filter: none; } }
  .anim-8 .chest-svg { animation: a8 1.2s forwards; } @keyframes a8 { 50% { transform: scale(1.25) rotate(45deg); filter: hue-rotate(180deg) brightness(1.8); } 100% { transform: none; filter: none; } }
  .anim-9 .chest-svg { animation: a9 1.1s forwards; } @keyframes a9 { 30% { transform: scale(0.5); } 65% { transform: scale(1.4); } 100% { transform: scale(1); } }
  .anim-10 .chest-svg { animation: a10 1.1s forwards; } @keyframes a10 { 0% { transform: translateY(-45px); } 40% { transform: translateY(10px) scaleY(0.75); } 70% { transform: translateY(-15px); } 100% { transform: none; } }
  .anim-11 .chest-svg { animation: a11 1.1s forwards; } @keyframes a11 { 50% { transform: perspective(300px) rotateX(180deg) scale(1.2); } 100% { transform: perspective(300px) rotateX(360deg); } }
  .anim-12 .chest-svg { animation: a12 1.2s forwards; } @keyframes a12 { 50% { transform: scale(1.2); filter: sepia(1) saturate(8) hue-rotate(-30deg) brightness(1.8); } 100% { transform: none; filter: none; } }
  .anim-13 .chest-svg { animation: a13 1.2s forwards; } @keyframes a13 { 40% { transform: scale(0.9); filter: hue-rotate(150deg) brightness(1.8); } 70% { transform: scale(1.25); } 100% { transform: none; filter: none; } }
  .anim-14 .chest-svg { transform-origin: top center; animation: a14 1.2s forwards; } @keyframes a14 { 25% { transform: rotate(35deg); } 50% { transform: rotate(-30deg); } 75% { transform: rotate(15deg); } 100% { transform: rotate(0); } }
  .anim-15 .chest-svg { animation: a15 1.6s forwards; } @keyframes a15 { 40% { transform: scale(1.4) translateY(-25px); filter: brightness(2.5) drop-shadow(0 0 25px gold); } 100% { transform: scale(1.1); filter: drop-shadow(0 0 15px gold); } }

  #toast { position: fixed; bottom: 25px; left: 16px; right: 16px; transform: translateY(150px); background: linear-gradient(90deg, #4c1d95, #1e3a8a); border: 1px solid var(--cyan); color: white; padding: 14px; border-radius: 16px; font-weight: 700; font-size: 0.9rem; z-index: 1000; transition: transform 0.4s; text-align: center; }
  #toast.show { transform: translateY(0); }
</style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<header>
  <div class="header-top">
    <h1>SECRET VAULT</h1>
    <div>
      <button class="icon-btn" id="sound-toggle">🔊 ON</button>
      <button class="icon-btn" id="reset-btn">🔄 Reset</button>
    </div>
  </div>
  <div class="stats-bar">
    <div class="stat-pill">
      <span>Coffres : <strong id="counter-text">0/15</strong></span>
      <div class="progress-wrap"><div class="progress-fill" id="progress-bar"></div></div>
    </div>
    <div class="stat-pill">💎 <span id="crystal-count">0</span></div>
  </div>
</header>

<main class="container" id="vault-list"></main>
<div id="toast"></div>

<script>
const CHESTS = [
  { id: 1, name: "Coffre de l'Explorateur", code: "1024", type: "normal", color: "#d97706", accent: "#fbbf24", desc: "Un coffre en chêne renforcé.", reward: "🪙 250 Pièces d'Or", crystals: 0, anim: "anim-1" },
  { id: 2, name: "Coffre du Vortex", code: "8492", type: "normal", color: "#2563eb", accent: "#38bdf8", desc: "Il vibre à une fréquence mystérieuse.", reward: "💎 15 Cristaux Azur", crystals: 15, anim: "anim-2" },
  { id: 3, name: "Coffre des Nuages", code: "3307", type: "normal", color: "#0284c7", accent: "#e0f2fe", desc: "Il flotte au-dessus du sol.", reward: "🪶 Plume d'Aether", crystals: 5, anim: "anim-3" },
  { id: 4, name: "Coffre Tellurique", code: "5910", type: "normal", color: "#78350f", accent: "#f59e0b", desc: "Scellé par la roche volcanique.", reward: "🪨 Fragment de Noyau", crystals: 10, anim: "anim-4" },
  { id: 5, name: "Coffre Dimensionnel", code: "7741", type: "normal", color: "#6d28d9", accent: "#c084fc", desc: "Son intérieur paraît infini.", reward: "🌀 Clé du Néant (Débloque un secret !)", crystals: 20, anim: "anim-5", reveals: 11 },
